<!doctype html>
<html lang="zh"><head><meta charset="utf-8" /><title>dyntool</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}#err{position:fixed;left:0;top:0;color:#f66;font:11px/1.3 monospace;white-space:pre-wrap;z-index:9}</style>
</head><body><div id="err"></div>
<script src="/vendor/pixi.min.js"></script>
<script src="/vendor/pixi-spine-3.8.js"></script>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const base = q.get('base') || 'assets_avatar_dyn_01';
  const t = parseFloat(q.get('t') || '0');
  const size = parseInt(q.get('size') || '200', 10);
  const wantAnim = q.get('anim');
  const dir = '/assets/local/playeravatar/dyn/' + base + '/';
  const errEl = document.getElementById('err');
  const fail = (m) => { errEl.textContent = String(m).slice(0, 700); document.title = 'ERR ' + String(m).slice(0, 80); };
  try {
    if (!window.PIXI) return fail('no PIXI');
    // 3.8 的 UMD 构建把自己挂在 PIXI.spine38（4.x 那个才叫 PIXI.spine）
    const C = PIXI.spine38 || PIXI.spine;
    if (!C) return fail('no PIXI.spine38 / PIXI.spine');
    const SpineCls = C.Spine || (C.core && C.core.Spine) || null;
    const AtlasCls = C.TextureAtlas || (C.core && C.core.TextureAtlas);
    const JsonCls = C.SkeletonJson || (C.core && C.core.SkeletonJson);
    const LoaderCls = C.AtlasAttachmentLoader || (C.core && C.core.AtlasAttachmentLoader);
    if (!SpineCls || !AtlasCls || !JsonCls || !LoaderCls) {
      return fail('missing classes spine=' + !!SpineCls + ' atlas=' + !!AtlasCls + ' json=' + !!JsonCls + ' loader=' + !!LoaderCls
        + ' keys=' + Object.keys(C).slice(0, 50).join(','));
    }
    const [atlasText, skelText] = await Promise.all([
      fetch(dir + 'dyn.atlas').then((r) => r.text()),
      fetch(dir + 'dyn.skel').then((r) => r.text()),
    ]);
    const atlas = new AtlasCls(atlasText, (line, cb) => cb(PIXI.Texture.from(line)));
    const data = new JsonCls(new LoaderCls(atlas)).readSkeletonData(JSON.parse(skelText));
    const app = new PIXI.Application({ width: size, height: size, backgroundAlpha: 0, antialias: true, preserveDrawingBuffer: true });
    document.body.appendChild(app.view);
    const sp = new SpineCls(data);
    app.stage.addChild(sp);
    const anims = data.animations || [];
    const names = anims.map((a) => a.name);
    const pick = (wantAnim && names.includes(wantAnim)) ? wantAnim : (names.find((n) => /idle|loop|default/i.test(n)) || names[0]);
    const chosen = anims.find((a) => a.name === pick) || {};
    sp.state.setAnimation(0, pick, false);
    sp.state.update(t); sp.state.apply(sp.skeleton); sp.skeleton.updateWorldTransform();
    const b = sp.getLocalBounds ? sp.getLocalBounds() : { x: 0, y: 0, width: size, height: size };
    const k = Math.min(size / Math.max(1, b.width), size / Math.max(1, b.height)) * 0.98;
    sp.scale.set(k);
    const b2 = sp.getLocalBounds ? sp.getLocalBounds() : b;
    sp.position.set(size / 2 - (b2.x + b2.width / 2), size / 2 - (b2.y + b2.height / 2));
    app.renderer.render(app.stage);
    document.title = 'OK pick=' + pick + ' n=' + names.length + ' dur=' + chosen.duration + ' names=' + names.join('|');
  } catch (e) { fail((e && e.message) || String(e)); }
})();
</script></body></html>
